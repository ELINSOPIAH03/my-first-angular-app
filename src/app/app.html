
<main class="main">
  <div class="content">
    <app-header></app-header>
    <div class="container p-4 mx-auto">
      <div class="min-h-screen">
        <div class="py-6">
          <div class="px-4 mx-auto max-w-7xl sm:px-6 md:px-8">
            <h1 class="text-2xl font-semibold text-gray-900 mb-4">Dashboard</h1>
          </div>
          <div class="px-4 mx-auto max-w-7xl sm:px-6 md:px-8 flex flex-col gap-4">
            <div
                *ngIf="showAlert"
                class="p-4 text-sm text-blue-800 rounded-lg bg-blue-50 dark:text-blue-400 flex items-center justify-between"
                role="alert">
                <div>
                  <span class="font-medium">Info alert!</span> {{ alertMessage }}
                </div>
                <button
                  (click)="closeAlert()"
                  class="text-blue-800 dark:text-blue-400 font-bold text-lg">
                  ✕
                </button>
              </div>

            <div class="py-4 grid grid-cols-4 gap-4">
              <!-- <app-card></app-card> -->
              <app-card 
                *ngFor="let data of dummyData"
                [title]="data.title" 
                [content]="data.content"
                (readMoreClicked)="ShowAlert($event)"></app-card>
            </div>
          </div>
        </div>
      </div>
    </div>
    <app-footer></app-footer>
  </div>
</main>

<router-outlet />
